  <title>Sun disc with twelve tapering rays and a lighter inner face.</title>
  <desc>
    A friendly sun: central disc, twelve separate tapered rays of slightly uneven length so it does not read as a regular star, inner circle. Weather, mornings, energy, summer. Not a star and not a sparkle. Rays accent2, disc accent, inner face paper.
