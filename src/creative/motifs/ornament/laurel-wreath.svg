<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-tags="laurel,wreath,victory,award,frame,badge,ornament,classical">
  <title>Two arcs of laurel leaves meeting at a ribbon, hollow in the centre.</title>
  <desc>
    A classical wreath: paired leaves along two arcs, open in the middle so a numeral, a seal or a short word can sit inside. Awards, graduation, 'winner', spa packaging, wedding stationery. Leaves accent, inner leaves accent2, ribbon paper.
