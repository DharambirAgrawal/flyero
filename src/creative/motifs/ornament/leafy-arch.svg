<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-tags="arch,leaves,wreath,frame,wedding,botanical,ornament,background">
  <title>A half-wreath arch of leaves, open underneath for a headline.</title>
  <desc>
    An arch of leaves sitting on the baseline, hollow in the middle — the wedding-invite / spa-menu frame. Place as a wash behind a short headline or a date. Leaves accent, inner row accent2, a bow paper at the crown.
