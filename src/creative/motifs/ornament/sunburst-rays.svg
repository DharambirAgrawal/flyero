<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-tags="sunburst,rays,background,poster,burst,halo,ornament,wash">
  <title>Poster sunburst of sixteen tapering rays around an open centre.</title>
  <desc>
    A background ornament: sixteen rays radiating from the middle with a hollow disc, the vintage travel-poster / circus-poster device. Sit it under a headline or a seal as a wash. Not a star and not the small burst shape. Long rays accent, short inner ring accent2, centre paper.
  </desc>
