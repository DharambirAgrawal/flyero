<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-tags="sunrise,sunset,dawn,morning,horizon,hope">
  <title>A rising sun over a horizon band with five rays.</title>
  <desc>A sunrise (or sunset). Mornings, hope, 'a new day'. Distinct from the full sun. Disc accent, rays accent2, sea muted, spark paper.</desc>
