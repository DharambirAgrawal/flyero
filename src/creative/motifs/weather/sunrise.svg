  <path data-tone="accent2" d="M 50 8 L 54 32 L 46 32 Z M 18 22 L 34 38 L 28 42 Z M 82 22 L 66 38 L 72 42 Z M 8 50 L 32 50 L 32 56 Z M 92 50 L 68 50 L 68 56 Z"/>
  <path data-tone="muted" d="M 8 70 H 92 A 4 4 0 0 1 96 74 V 90 A 4 4 0 0 1 92 94 H 8 A 4 4 0 0 1 4 90 V 74 A 4 4 0 0 1 8 70 Z"/>
  <path data-tone="paper" d="M 38 58 A 12 12 0 1 1 62 58 A 12 12 0 1 1 38 58 Z"/>
</svg>
