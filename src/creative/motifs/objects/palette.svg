  <path data-tone="accent2" d="M 55 30 A 7 7 0 1 1 69 30 A 7 7 0 1 1 55 30 Z"/>
  <path data-tone="paper" d="M 65 50 A 7 7 0 1 1 79 50 A 7 7 0 1 1 65 50 Z"/>
  <path data-tone="muted" d="M 51 68 A 7 7 0 1 1 65 68 A 7 7 0 1 1 51 68 Z"/>
